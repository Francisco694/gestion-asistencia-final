<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga Masiva de Asistentes - UVENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- FIREBASE (Mismos scripts que el index para compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
    
    <!-- Tu lógica de base de datos -->
    <script src="js/firebase-config.js"></script>
    <script src="js/db.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans flex items-center justify-center p-6">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Panel Izquierdo: Instrucciones -->
        <div class="w-full md:w-1/3 bg-brand-dark text-white p-8 flex flex-col justify-between">
            <div>
                <h1 class="text-3xl font-bold tracking-widest mb-2">UVENT</h1>
                <p class="text-brand-green text-sm font-bold uppercase tracking-wider mb-8">Bulk Loader Tool</p>
                
                <div class="space-y-4 text-sm text-gray-300">
                    <p><i class="fas fa-info-circle mr-2 text-brand-green"></i> <strong>Paso 1:</strong> Selecciona el evento al que quieres agregar gente.</p>
                    <p><i class="fas fa-paste mr-2 text-brand-green"></i> <strong>Paso 2:</strong> Pega la lista de invitados.</p>
                    <p><i class="fas fa-check-circle mr-2 text-brand-green"></i> <strong>Formato:</strong><br>
                    <code class="bg-gray-800 px-2 py-1 rounded text-white block mt-1">Nombre Apellido, correo@email.com</code></p>
                </div>
            </div>
            <div class="mt-8">
                <a href="admin.html" class="text-sm text-gray-400 hover:text-white flex items-center gap-2 transition">
                    <i class="fas fa-arrow-left"></i> Volver al Admin
                </a>
            </div>
        </div>

        <!-- Panel Derecho: Formulario -->
        <div class="w-full md:w-2/3 p-8">
            
            <!-- Selección de Evento -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">1. Seleccionar Evento Destino</label>
                <div class="relative">
                    <select id="eventSelect" class="block w-full border border-gray-300 rounded-lg p-3 pr-10 focus:ring-2 focus:ring-brand-green outline-none appearance-none bg-white cursor-pointer">
                        <option value="">Cargando eventos...</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </div>

            <!-- Área de Texto -->
            <div class="mb-6">
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-sm font-bold text-gray-700">2. Pegar Lista de Invitados</label>
                    <button onclick="loadExample()" class="text-xs text-brand-green hover:underline">Cargar ejemplo</button>
                </div>
                <textarea id="csvInput" rows="8" class="w-full border border-gray-300 rounded-lg p-4 font-mono text-sm focus:ring-2 focus:ring-brand-green outline-none" placeholder="Juan Perez, juan@test.com&#10;Maria Soto, maria@test.com&#10;..."></textarea>
                <p class="text-xs text-gray-400 mt-2 text-right" id="lineCount">0 líneas detectadas</p>
            </div>

            <!-- Botón y Progreso -->
            <div>
                <button id="btnProcess" onclick="processBulkLoad()" class="w-full bg-brand-green text-white font-bold py-4 rounded-lg shadow-lg hover:bg-opacity-90 transition transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-upload mr-2"></i> Procesar Lista
                </button>
                
                <!-- Barra de Progreso (Oculta) -->
                <div id="progressContainer" class="hidden mt-4">
                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                        <span id="progressText">Procesando...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progressBar" class="bg-brand-green h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Log de Resultados -->
                <div id="logContainer" class="hidden mt-4 bg-gray-50 border border-gray-200 rounded-lg p-4 h-32 overflow-y-auto text-xs font-mono"></div>
            </div>
        </div>
    </div>

    <script>
        // Lógica específica de la herramienta
        document.addEventListener('DOMContentLoaded', async () => {
            const select = document.getElementById('eventSelect');
            const textarea = document.getElementById('csvInput');
            
            // 1. Cargar Eventos al Select
            try {
                // Usamos la función existente en db.js
                const events = await getEventsDB({ status: 'approved' }); // Solo eventos aprobados
                
                select.innerHTML = '<option value="">-- Selecciona un evento --</option>';
                if (events.length === 0) {
                    select.innerHTML = '<option value="">No hay eventos aprobados disponibles</option>';
                } else {
                    events.forEach(ev => {
                        const option = document.createElement('option');
                        option.value = ev.id;
                        option.textContent = `${ev.name} (${ev.date})`;
                        select.appendChild(option);
                    });
                }
            } catch (e) {
                console.error(e);
                select.innerHTML = '<option value="">Error cargando eventos</option>';
            }

            // Contador de líneas
            textarea.addEventListener('input', () => {
                const lines = textarea.value.split('\n').filter(line => line.trim() !== '').length;
                document.getElementById('lineCount').textContent = `${lines} invitados detectados`;
            });
        });

        function loadExample() {
            const example = "Ana Torres, ana.torres@email.com\nCarlos Ruiz, cruiz@empresa.cl\nValentina Paz, valen.paz@uvent.cl\nRoberto Gomez, rgomez@mail.com\nSofia Loren, sloren@cine.com";
            document.getElementById('csvInput').value = example;
            document.getElementById('csvInput').dispatchEvent(new Event('input'));
        }

        async function processBulkLoad() {
            const eventId = document.getElementById('eventSelect').value;
            const text = document.getElementById('csvInput').value;
            const btn = document.getElementById('btnProcess');
            const logDiv = document.getElementById('logContainer');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            
            if (!eventId) return alert("Por favor selecciona un evento.");
            if (!text.trim()) return alert("La lista está vacía.");

            // Preparar UI
            btn.disabled = true;
            btn.innerText = "Procesando...";
            logDiv.classList.remove('hidden');
            logDiv.innerHTML = ''; // Limpiar log
            progressContainer.classList.remove('hidden');

            // Parsear líneas
            const lines = text.split('\n').filter(l => l.trim() !== '');
            let successCount = 0;
            let errorCount = 0;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                // Intentar separar por coma
                const parts = line.split(',');
                
                if (parts.length < 2) {
                    log(`[ERROR] Formato inválido en línea: "${line}"`, 'text-red-500');
                    errorCount++;
                    continue;
                }

                const name = parts[0].trim();
                const email = parts[1].trim();

                try {
                    // Usamos la función de db.js para inscribir
                    await enrollInEventDB(eventId, {
                        name: name,
                        email: email,
                        source: 'bulk_load'
                    });
                    log(`[OK] Inscrito: ${name}`, 'text-green-600');
                    successCount++;
                } catch (e) {
                    log(`[ERROR] Falló ${name}: ${e.message}`, 'text-red-500');
                    errorCount++;
                }

                // Actualizar barra
                const percent = Math.round(((i + 1) / lines.length) * 100);
                progressBar.style.width = `${percent}%`;
                document.getElementById('progressPercent').textContent = `${percent}%`;
            }

            // Finalizar
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Finalizado';
            alert(`Proceso completado.\nCorrectos: ${successCount}\nErrores: ${errorCount}`);
        }

        function log(msg, colorClass = 'text-gray-600') {
            const div = document.getElementById('logContainer');
            const p = document.createElement('div');
            p.className = `mb-1 ${colorClass}`;
            p.textContent = msg;
            div.appendChild(p);
            div.scrollTop = div.scrollHeight;
        }
    </script>
</body>
</html>
